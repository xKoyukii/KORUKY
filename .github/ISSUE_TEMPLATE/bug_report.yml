name: Bug report
description: Report a reproducible problem
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the exact steps and expected behavior.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: KORUKY version
    validations:
      required: true
